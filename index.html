<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>El Jurado</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: linear-gradient(180deg,#f3f0ff,#faf9ff);
  color: #222;
}

.app {
  max-width: 600px;
  margin: auto;
  padding: 25px 18px 45px;
}

.logo {
  text-align: center;
  font-size: 58px;
}

h1 {
  text-align: center;
  color: #5b36d6;
  font-size: 40px;
  margin: 5px 0;
}

.subtitulo {
  text-align: center;
  color: #666;
  line-height: 1.5;
  margin-bottom: 25px;
}

.tarjeta {
  background: white;
  padding: 22px;
  border-radius: 22px;
  box-shadow: 0 8px 25px rgba(0,0,0,.08);
}

.bloque {
  margin-bottom: 22px;
}

label {
  display: block;
  font-size: 18px;
  font-weight: bold;
  margin-bottom: 8px;
}

.persona-a {
  color: #5b36d6;
}

.persona-b {
  color: #d04478;
}

textarea {
  width: 100%;
  height: 135px;
  padding: 14px;
  border: 2px solid #ddd;
  border-radius: 14px;
  font-family: Arial, sans-serif;
  font-size: 16px;
  resize: vertical;
}

textarea:focus {
  outline: none;
  border-color: #5b36d6;
}

button {
  width: 100%;
  border: 0;
  border-radius: 15px;
  padding: 17px;
  background: #5b36d6;
  color: white;
  font-size: 18px;
  font-weight: bold;
  cursor: pointer;
}

button:active {
  transform: scale(.98);
}

#resultado {
  display: none;
  margin-top: 22px;
  background: #f1edff;
  border-radius: 18px;
  padding: 20px;
}

.veredicto {
  text-align: center;
  font-size: 25px;
  font-weight: bold;
  color: #5b36d6;
  margin-bottom: 15px;
}

.porcentajes {
  display: flex;
  gap: 10px;
  margin: 18px 0;
}
