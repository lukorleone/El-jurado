<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>El Jurado</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f1ff;
      color: #222;
    }

    .app {
      max-width: 600px;
      margin: auto;
      padding: 25px 18px;
    }

    .logo {
      text-align: center;
      font-size: 55px;
    }

    h1 {
      text-align: center;
      margin: 5px 0;
      font-size: 38px;
      color: #5b36d6;
    }

    .subtitulo {
      text-align: center;
      color: #666;
      margin-bottom: 30px;
    }

    .tarjeta {
      background: white;
      padding: 22px;
      border-radius: 20px;
      box-shadow: 0 5px 20px rgba(0,0,0,.08);
    }

    label {
      font-weight: bold;
      display: block;
      margin-bottom: 10px;
    }

    textarea {
      width: 100%;
      height: 180px;
      padding: 15px;
      border: 2px solid #ddd;
      border-radius: 14px;
      resize: none;
      font-size: 16px;
    }

    button {
      width: 100%;
      margin-top: 18px;
      padding: 16px;
      border: 0;
      border-radius: 14px;
      background: #5b36d6;
      color: white;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    #resultado {
      display: none;
      margin-top: 20px;
      padding: 18px;
      background: #eee9ff;
      border-radius: 14px;
    }

    .aviso {
      margin-top: 20px;
      text-align: center;
      font-size: 12px;
      color: #777;
    }
  </style>
</head>

<body>

<div class="app">

  <div class="logo">⚖️</div>

  <h1>El Jurado</h1>

  <p class="subtitulo">
    Cuéntanos vuestra discusión.<br>
    El Jurado analizará ambas versiones.
  </p>

  <div class="tarjeta">

    <label for="historia">
      ¿Qué ha pasado?
    </label>

    <textarea
      id="historia"
      placeholder="Cuéntanos la discusión. Explica qué ocurrió, qué dijiste tú y qué dijo tu pareja..."
    ></textarea>

    <button onclick="juzgar()">
      ⚖️ Que decida El Jurado
    </button>

    <div id="resultado"></div>

  </div>

  <p class="aviso">
    El Jurado ofrece una opinión orientativa y no sustituye asesoramiento profesional.
  </p>

</div>

<script>
function juzgar() {

  const historia = document.getElementById("historia").value;
  const resultado = document.getElementById("resultado");

  if (historia.trim() === "") {
    alert("Primero cuéntanos qué ha ocurrido.");
    return;
  }

  resultado.style.display = "block";

  resultado.innerHTML =
    "<strong>⚖️ El Jurado está preparado.</strong><br><br>" +
    "Hemos recibido vuestra historia. En el siguiente paso conectaremos la inteligencia artificial para analizar quién tiene más razón y explicar por qué.";
}
</script>

</body>
</html>
